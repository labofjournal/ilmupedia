<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="page-l" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>

  <!-- Rounded Squircle Badge -->
  <rect width="100" height="100" rx="26" fill="url(#logo-bg)" />

  <!-- Open Book Wings -->
  <!-- Left Wing -->
  <path d="M 18 32 C 32 29, 44 33, 48 38 L 48 76 C 44 72, 32 68, 18 71 Z" fill="url(#page-l)" />
  <!-- Right Wing -->
  <path d="M 82 32 C 68 29, 56 33, 52 38 L 52 76 C 56 72, 68 68, 82 71 Z" fill="#ffffff" />

  <!-- Center Spine / Fold -->
  <line x1="50" y1="37" x2="50" y2="78" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" />

  <!-- Page Text Rows (Left) -->
  <line x1="25" y1="43" x2="42" y2="45" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" />
  <line x1="25" y1="52" x2="42" y2="54" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" />
  <line x1="25" y1="61" x2="38" y2="63" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" />

  <!-- Page Text Rows (Right) -->
  <line x1="75" y1="43" x2="58" y2="45" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" />
  <line x1="75" y1="52" x2="58" y2="54" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" />
  <line x1="75" y1="61" x2="62" y2="63" stroke="#93c5fd" stroke-width="2.5" stroke-linecap="round" />

  <!-- Golden Bookmark Ribbon on Top Spine -->
  <path d="M 50 22 L 50 35 L 53 32 L 56 35 L 56 22 Z" fill="#fbbf24" />
</svg>
